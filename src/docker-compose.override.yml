services:
  ae031db:
    container_name: ae031db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=AE031_EDCL_GPS_DB
    restart: always
    ports:
      - "5436:5432"
    volumes:
      - postgres_ae031db:/var/lib/postgresql/data/

  distributedcache:
    container_name: distributedcache
    restart: always
    ports:
      - "6379:6379"

  seq:
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    restart: always
    ports:
      - "5341:5341"
      - "9091:80"

  messagebus:
    container_name: messagebus
    hostname: ecommerce-mq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ../database/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../database/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
      
  messagebus5672:
    container_name: messagebus5672
    hostname: ecommerce-mq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../database/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../database/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro

  mongodb:
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=adminpassword
      - MONGO_INITDB_DATABASE=edcl_logs_db
    volumes:
      - mongodb_data:/data/db
      - ../database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  mongo-express:
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=adminpassword
      - ME_CONFIG_MONGODB_URL=mongodb://admin:adminpassword@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongodb

  prometheus:
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../database/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  api-gateway:
    container_name: api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ReverseProxy__Clusters__position-query-cluster__Destinations__destination1__Address=http://position-query-svc:8080
      - ReverseProxy__Clusters__vendor-master-cluster__Destinations__destination1__Address=http://vendor-master-svc:8080
      - ReverseProxy__Clusters__delivery-tracking-cluster__Destinations__destination1__Address=http://delivery-tracking-svc:8080
    ports:
      - "5000:8080"
      - "8080:8080"
    depends_on:
      - distributedcache

  gps-collector-svc:
    container_name: gps-collector-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Server=ae031db;Port=5432;Database=AE031_EDCL_GPS_DB;User Id=postgres;Password=postgres;Include Error Detail=true;Timezone=Asia/Jakarta;
      - ConnectionStrings__Redis=distributedcache:6379
      - MongoDb__ConnectionString=mongodb://admin:adminpassword@mongodb:27017/?authSource=admin
      - MongoDb__DatabaseName=edcl_logs_db
      - RabbitMq__HostName=messagebus
      - Worker__Enabled=true
    ports:
      - "8082:8080"
    depends_on:
      - ae031db
      - distributedcache
      - mongodb
      - messagebus

  position-query-svc:
    container_name: position-query-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Server=ae031db;Port=5432;Database=AE031_EDCL_GPS_DB;User Id=postgres;Password=postgres;Include Error Detail=true;Timezone=Asia/Jakarta;
      - ConnectionStrings__Redis=distributedcache:6379
    ports:
      - "8083:8080"
    depends_on:
      - ae031db
      - distributedcache

  vendor-master-svc:
    container_name: vendor-master-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Server=ae031db;Port=5432;Database=AE031_EDCL_GPS_DB;User Id=postgres;Password=postgres;Include Error Detail=true;Timezone=Asia/Jakarta;
    ports:
      - "8084:8080"
    depends_on:
      - ae031db

  delivery-tracking-svc:
    container_name: delivery-tracking-svc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Server=ae031db;Port=5432;Database=AE031_EDCL_GPS_DB;User Id=postgres;Password=postgres;Include Error Detail=true;Timezone=Asia/Jakarta;
    ports:
      - "8085:8080"
    depends_on:
      - ae031db



