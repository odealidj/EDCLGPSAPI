services:
  ae031db:
    image: postgres

  distributedcache:
    image: redis

  seq:
    image: datalust/seq:latest

  messagebus:
    image: rabbitmq:management
    
  messagebus5672:
      image: rabbitmq:management

  mongodb:
    image: mongo:7.0

  mongo-express:
    image: mongo-express:latest

  api-gateway:
    image: ${DOCKER_REGISTRY-}apigateway
    build:
      context: ..
      dockerfile: src/Services/ApiGateway/Dockerfile

  gps-collector-svc:
    image: ${DOCKER_REGISTRY-}gpscollectorsvc
    build:
      context: ..
      dockerfile: src/Services/GpsCollector/Dockerfile

  position-query-svc:
    image: ${DOCKER_REGISTRY-}positionquerysvc
    build:
      context: ..
      dockerfile: src/Services/PositionQuery.Api/Dockerfile

volumes:
  postgres_ae031db:
  mongodb_data: