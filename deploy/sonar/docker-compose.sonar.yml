services:
  sonarqube-db:
    image: postgres:16-alpine
    container_name: edcl-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_secure_password_123
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - sonar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:lts-community
    container_name: edcl-sonarqube-server
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_secure_password_123
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
    ports:
      - "9000:9000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - sonar-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s

networks:
  sonar-net:
    name: edcl-sonar-network

volumes:
  sonarqube_data:
    name: edcl_sonarqube_data
  sonarqube_extensions:
    name: edcl_sonarqube_extensions
  sonarqube_logs:
    name: edcl_sonarqube_logs
  sonarqube_db_data:
    name: edcl_sonarqube_db_data
