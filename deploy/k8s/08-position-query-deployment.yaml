apiVersion: apps/v1
kind: Deployment
metadata:
  name: position-query-deployment
  namespace: edcl-prod
  labels:
    app: position-query-svc
    app.kubernetes.io/part-of: edcl-gps-telematics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: position-query-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: position-query-svc
    spec:
      automountServiceAccountToken: false
      containers:
        - name: position-query-svc
          image: ghcr.io/odealidj/edcl-position-query-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: edcl-gps-config
            - secretRef:
                name: edcl-gps-secret
          env:
            - name: ConnectionStrings__Database
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);Include Error Detail=true;Timezone=Asia/Jakarta;"
            - name: ConnectionStrings__Redis
              value: "$(REDIS_HOST):$(REDIS_PORT)"
          livenessProbe:
            httpGet:
              path: /hc
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /hc
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 2
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
              ephemeral-storage: "256Mi"
            limits:
              memory: "512Mi"
              cpu: "1000m"
              ephemeral-storage: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: position-query-svc
  namespace: edcl-prod
  labels:
    app: position-query-svc
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: position-query-svc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: position-query-hpa
  namespace: edcl-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: position-query-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
