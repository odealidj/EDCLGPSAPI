# =============================================================================
# Local Kubernetes Infrastructure Stack (edcl-infra)
# PostgreSQL, MongoDB 7, Redis, and RabbitMQ
# =============================================================================

# --- Infra Secret ---
apiVersion: v1
kind: Secret
metadata:
  name: edcl-infra-secret
  namespace: edcl-infra
type: Opaque
data:
  # Base64 encoded credentials (postgres, adminpassword, guest)
  POSTGRES_PASSWORD: cGFzc3dvcmQ=
  MONGO_ROOT_PASSWORD: YWRtaW5wYXNzd29yZA==
  RABBITMQ_DEFAULT_PASS: Z3Vlc3Q=
---
# --- PostgreSQL ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-statefulset
  namespace: edcl-infra
spec:
  serviceName: postgres-svc
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edcl-infra-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "AE031_EDCL_GPS_DB"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: edcl-infra
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres

---
# --- MongoDB 7 ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-statefulset
  namespace: edcl-infra
spec:
  serviceName: mongodb-svc
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "admin"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edcl-infra-secret
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: "edcl_logs_db"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-svc
  namespace: edcl-infra
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongodb

---
# --- Redis ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: edcl-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: edcl-infra
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis

---
# --- RabbitMQ ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq-statefulset
  namespace: edcl-infra
spec:
  serviceName: rabbitmq-svc
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: edcl-infra-secret
                  key: RABBITMQ_DEFAULT_PASS
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-svc
  namespace: edcl-infra
spec:
  ports:
    - port: 5672
      name: amqp
      targetPort: 5672
    - port: 15672
      name: management
      targetPort: 15672
  selector:
    app: rabbitmq
