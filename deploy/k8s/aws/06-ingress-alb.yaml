# =============================================================================
# AWS Application Load Balancer (ALB) Ingress for EDCL API Gateway
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edcl-gps-alb-ingress
  namespace: edcl-prod
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Ganti dengan ARN Sertifikat ACM di AWS Certificate Manager
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:123456789012:certificate/your-cert-uuid
    alb.ingress.kubernetes.io/healthcheck-path: /hc
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
spec:
  rules:
    - host: api.edcl-gps.com
      http:
        paths:
          # Semua traffic publik diteruskan ke API Gateway 1 Pintu
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edcl-api-gateway-svc
                port:
                  number: 80
