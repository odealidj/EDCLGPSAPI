# =============================================================================
# External Secrets Operator (ESO) integration with AWS Secrets Manager
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: edcl-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: edcl-gps-external-secret
  namespace: edcl-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: edcl-gps-secret # Nama K8s Secret yang digunakan oleh Pods
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: production/edcl-gps/database
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: production/edcl-gps/database
        property: password
    - secretKey: MONGO_APP_USER
      remoteRef:
        key: production/edcl-gps/mongodb
        property: username
    - secretKey: MONGO_APP_PASS
      remoteRef:
        key: production/edcl-gps/mongodb
        property: password
    - secretKey: RABBITMQ_USER
      remoteRef:
        key: production/edcl-gps/rabbitmq
        property: username
    - secretKey: RABBITMQ_PASS
      remoteRef:
        key: production/edcl-gps/rabbitmq
        property: password
