apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendor-master-deployment
  namespace: edcl-prod
  labels:
    app: vendor-master-svc
    app.kubernetes.io/part-of: edcl-gps-telematics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vendor-master-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vendor-master-svc
    spec:
      containers:
        - name: vendor-master-svc
          image: ghcr.io/odealidj/edcl-vendor-master-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: edcl-gps-config
            - secretRef:
                name: edcl-gps-secret
          env:
            - name: ConnectionStrings__Database
              value: "Host=$(POSTGRES_HOST);Port=$(POSTGRES_PORT);Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);Include Error Detail=true;Timezone=Asia/Jakarta;"
          livenessProbe:
            httpGet:
              path: /hc
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /hc
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 2
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: vendor-master-svc
  namespace: edcl-prod
  labels:
    app: vendor-master-svc
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: vendor-master-svc
