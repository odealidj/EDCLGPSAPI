apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: edcl-gps-cluster
  region: ap-southeast-1
  version: "1.30"
  tags:
    Environment: Production
    Project: EDCL-GPS-Telematics

iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      wellKnownPolicies:
        awsLoadBalancerController: true
    - metadata:
        name: external-secrets-sa
        namespace: edcl-prod
      attachPolicyARNs:
        - "arn:aws:iam::aws:policy/SecretsManagerReadWrite"
    - metadata:
        name: ebs-csi-controller-sa
        namespace: kube-system
      wellKnownPolicies:
        ebsCSIController: true

vpc:
  cidr: "10.0.0.0/16"
  nat:
    gateway: HighlyAvailable # 3 AZs for true production HA

managedNodeGroups:
  - name: edcl-core-nodes
    instanceType: t3.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 6
    volumeSize: 50
    volumeType: gp3
    privateNetworking: true
    labels:
      role: worker
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/edcl-gps-cluster: "owned"

  - name: edcl-spot-nodes
    instanceTypes: ["t3.large", "m5.large"]
    spot: true
    desiredCapacity: 2
    minSize: 1
    maxSize: 10
    volumeSize: 50
    volumeType: gp3
    privateNetworking: true
    labels:
      role: autoscaled-worker
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/edcl-gps-cluster: "owned"

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
