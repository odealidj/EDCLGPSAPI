name: Continuous Integration & SonarQube Cloud

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'refactor/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'feat/**'

jobs:
  build-and-analyze:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner .NET Tool
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore Dependencies
        run: dotnet restore src/edcl-gps-api.sln

      - name: SonarQube Begin Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"odealidj_EDCLGPSAPI" \
            /o:"odealidj" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Program.cs,**/*Module.cs,**/Dockerfile,**/Migrations/**,**/*.sql,src/Shared/**,**/Extensions/**,**/Data/Mongo/Documents/**,**/*Settings.cs,**/*Options.cs,**/Exceptions/**,**/DTOs/**,**/*Dto.cs,**/*Request.cs,**/*Response.cs,src/Services/GpsCollector/Infrastructure/Adapters/Persistence/**,src/Services/VendorMaster/VendorMaster.Infrastructure/**,**/Infrastructure/Persistence/**,**/Infrastructure/Services/**" \
            /d:sonar.cpd.exclusions="src/Shared/Shared.Contracts/**" \
            /d:sonar.exclusions="**/*.template.yaml,**/*.template.json,deploy/k8s/aws/**"

      - name: Build Solution
        run: dotnet build src/edcl-gps-api.sln -c Release --no-restore

      - name: Run Tests with OpenCover Coverage
        run: dotnet test src/edcl-gps-api.sln -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: SonarQube End Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
