name: Continuous Integration

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/edcl-gps-api.sln

      - name: Build Solution
        run: dotnet build src/edcl-gps-api.sln -c Release --no-restore

      - name: Run Tests
        run: dotnet test src/edcl-gps-api.sln -c Release --no-build --verbosity normal
