name: Continuous Delivery - Microservices

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'deploy/**'
      - '.github/workflows/cd-services.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/edcl

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api-gateway
            dockerfile: src/Services/ApiGateway/Dockerfile
            image_name: edcl-api-gateway
          - service: gps-collector
            dockerfile: src/Services/GpsCollector/Dockerfile
            image_name: edcl-gps-collector
          - service: vendor-master
            dockerfile: src/Services/VendorMaster/VendorMaster.Api/Dockerfile
            image_name: edcl-vendor-master-svc
          - service: delivery-tracking
            dockerfile: src/Services/DeliveryTracking.Api/Dockerfile
            image_name: edcl-delivery-tracking-svc
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v5.5.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
